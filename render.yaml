services:
  # -------------------------------------------------------------
  # 1. Backend API Service (FastAPI + ML Engine + Background Jobs)
  # -------------------------------------------------------------
  - type: web
    name: leadintel-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip setuptools wheel && pip install --prefer-binary -r requirements.txt && python -m app.cli bootstrap --skip-history"
    startCommand: "python -m app.cli serve --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEMO_MODE
        value: "true"
      - key: ENVIRONMENT
        value: "production"
      - key: EMAIL_FROM
        value: "krishna.jain24@spit.ac.in"
      - key: CRM_OWNER_EMAIL
        value: "admin@xeducation.in"
      - key: CRM_OWNER_NAME
        value: "Admin"
      - key: CRM_OWNER_PASSWORD
        value: "Leadintel@123"
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LEARNING_LOOP_ENABLED
        value: "false"
      - key: BREVO_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false

  # -------------------------------------------------------------
  # 2. Public Learner Website (React + Vite)
  # -------------------------------------------------------------
  - type: web
    name: leadintel-web
    runtime: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build -w web"
    staticPublishPath: "./web/dist"
    envVars:
      - key: VITE_API_URL
        value: "https://leadintel-backend.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # -------------------------------------------------------------
  # 3. CRM Dashboard (Staff & Team Analytics)
  # -------------------------------------------------------------
  - type: web
    name: leadintel-crm
    runtime: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build -w crm"
    staticPublishPath: "./crm/dist"
    envVars:
      - key: VITE_API_URL
        value: "https://leadintel-backend.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
