<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Online programmes in data, marketing, management, finance, HR, operations and e-commerce, with live sessions and a capstone project."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>X Education</title>
    <script>
      (() => {
        try {
          var c = localStorage.getItem("xe-theme");
          var d = c === "dark" || ((!c || c === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
          if (d) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
