# Alembic (database migrations). The backend runs them by itself at start-up (app.db.init_db);
# this file is only for the command line, e.g. from the backend folder:
#   .venv\Scripts\alembic revision -m "add a column"      (then edit the new file in app/db/migrations/versions)
#   .venv\Scripts\alembic upgrade head
[alembic]
script_location = app/db/migrations
sqlalchemy.url = sqlite:///data/xeducation.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
